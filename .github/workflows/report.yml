name: CRAN macOS GDAL report

on:
  schedule:
    # 03:17 UTC on the 1st of every month
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: report (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: arm64
          - os: macos-15-intel
            label: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: false

      - name: Install CRAN binaries
        run: |
          Rscript -e 'options(repos = c(CRAN = "https://cloud.r-project.org"));
            install.packages(c("sf", "terra", "gdalraster", "vapour"), type = "binary")'

      - name: Run report
        run: Rscript scripts/report.R out ${{ matrix.label }}

      - name: Job summary
        if: always()
        run: cat out/report-${{ matrix.label }}.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.label }}
          path: out/

  publish:
    needs: report
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble reports and README
        run: |
          if ! find artifacts -name 'summary-*.tsv' | grep -q .; then
            echo "no reports produced"; exit 1
          fi
          bash scripts/assemble.sh artifacts

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md reports
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "CRAN macOS GDAL report $(date -u +%Y-%m-%d)"
            git push
          fi
